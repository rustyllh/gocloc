name: release

on:
  push:
    tags:
      - 'v*.*.*'
  # A manual run packages and verifies a snapshot but never publishes it.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/go.yml

  installers:
    uses: ./.github/workflows/installers.yml

  package:
    needs: [test, installers]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: Package without publishing
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean --skip=publish,announce ${{ github.event_name == 'workflow_dispatch' && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read packaged version
        id: metadata
        shell: bash
        run: |
          version=$(jq -er '.version' dist/metadata.json)
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Upload release candidates
        uses: actions/upload-artifact@v7
        with:
          name: release-candidates
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*_checksums.txt

  smoke:
    name: Packaged CLI (${{ matrix.os }})
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: release-candidates
          path: release-candidates
      - name: Verify checksums, version and CLI behavior from the native archive
        env:
          GOCLOC_RELEASE_DIR: ${{ github.workspace }}/release-candidates
          GOCLOC_RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: go test -tags=integration ./cmd/gocloc -run '^TestCLIIntegration$' -count=1 -v

  docker:
    name: Docker Hub (amd64 / arm64)
    needs: [package, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: release-candidates
          path: release-candidates
      - name: Set up ARM emulation for image tests
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and test images from the verified release binaries
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          GOCLOC_REVISION: ${{ github.sha }}
        run: bash scripts/build-docker-release.sh release-candidates "$RELEASE_VERSION"
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish tested images and the multi-platform manifest
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          IMAGE: rustyllh/gocloc
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          for arch in amd64 arm64; do
            docker tag "gocloc-release-candidate:$arch" "$IMAGE:$RELEASE_TAG-$arch"
            docker push "$IMAGE:$RELEASE_TAG-$arch"
          done
          tags=(--tag "$IMAGE:$RELEASE_TAG")
          if [[ "$RELEASE_TAG" != *-* ]]; then
            tags+=(--tag "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "$IMAGE:$RELEASE_TAG-amd64" "$IMAGE:$RELEASE_TAG-arm64"
          docker buildx imagetools inspect "$IMAGE:$RELEASE_TAG" --raw |
            jq -e '([.manifests[].platform | .os + "/" + .architecture] | sort) == ["linux/amd64", "linux/arm64"]'

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [smoke, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-candidates
          path: release-candidates
      - name: Publish the tested archives without rebuilding
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          args=(--verify-tag --generate-notes --title "$RELEASE_TAG")
          if [[ "$RELEASE_TAG" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}" release-candidates/*
