name: Go

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  build:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go: ['1.23.x', 'stable']
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Download modules
        run: go mod download

      - name: Check formatting and imports
        shell: bash
        run: |
          # Pin a version that supports the minimum Go version without editing go.mod.
          format_diff=$(go run golang.org/x/tools/cmd/goimports@v0.24.0 -d .)
          if [ -n "$format_diff" ]; then
            printf '%s\n' "$format_diff"
            exit 1
          fi

      - name: Build
        run: go build -o ./bin/gocloc ./cmd/gocloc

      - name: Test
        run: go test -race -tags=integration ./...
