name: Go

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: go-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  build:
    name: Go stable (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: Download modules
        run: go mod download

      - name: Check formatting and imports
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          # Pin the formatter for consistent results without editing go.mod.
          format_diff=$(go run golang.org/x/tools/cmd/goimports@v0.24.0 -d .)
          if [ -n "$format_diff" ]; then
            printf '%s\n' "$format_diff"
            exit 1
          fi

      - name: Build with Makefile
        if: matrix.os != 'windows-latest'
        run: make build

      - name: Build on Windows
        if: matrix.os == 'windows-latest'
        run: go build -o ./bin/ ./cmd/gocloc

      - name: Test
        run: go test -race -tags=integration ./...
